<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F7F9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C1923" />
    <link rel="preload" href="/src/styles/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/styles/sora.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <title>Axir Admin — Console Operacional</title>
    <script>
      (function () {
        try {
          var themePref = localStorage.getItem("financas_active_theme");
          var darkVariant = localStorage.getItem("financas_active_dark_theme_variant") || "dark";
          var resolvedTheme = "light";

          if (!themePref || themePref === "system") {
            var prefersDark =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            resolvedTheme = prefersDark ? (darkVariant === "oled" ? "oled" : "dark") : "light";
          } else if (themePref === "dark" || themePref === "oled") {
            resolvedTheme = themePref;
          }

          document.documentElement.setAttribute("data-theme", resolvedTheme);
          document.documentElement.style.colorScheme = resolvedTheme === "light" ? "light" : "dark";
          document.documentElement.removeAttribute("data-accent");
        } catch (e) {}
      })();
    </script>
    <style>
      html {
        margin: 0;
        padding: 0;
        background-color: #F4F7F9;
        color: #142531;
        color-scheme: light;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: clip;
      }

      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: inherit;
        color: inherit;
      }

      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background-color: #0C1923;
        color: #E6EFF5;
        color-scheme: dark;
      }

      html[data-theme="oled"],
      html[data-theme="oled"] body {
        background-color: #000000;
        color: #EDEDED;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/admin-main.tsx"></script>
  </body>
</html>
