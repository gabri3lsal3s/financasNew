<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Gestão financeira pessoal e rebalanceamento de carteira." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F7F9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C1923" />
    <link rel="manifest" href="/pwa/manifest.webmanifest" />
    <!-- Favicons com cache-busting (?v=2 — o navegador mantém o favicon antigo agressivamente) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa/icons/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/pwa/icons/apple-touch-icon-180.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Guia Financeiro" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <title>Guia Financeiro</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('financas:theme');
          if (!theme || theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);

          var themeColor = theme === 'oled' ? '#000000' : (theme === 'dark' ? '#0C1923' : '#F4F7F9');
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas.forEach(function(m) {
            m.setAttribute('content', themeColor);
          });

          var accent = localStorage.getItem('financas_accent_theme');
          if (accent && accent !== 'teal') {
            document.documentElement.setAttribute('data-accent', accent);
          }
          var surface = localStorage.getItem('financas_surface_style');
          if (surface && surface !== 'glass') {
            document.documentElement.setAttribute('data-surface-style', surface);
          }
          var motion = localStorage.getItem('financas_motion_level');
          if (motion && motion !== 'fluid') {
            document.documentElement.setAttribute('data-motion', motion);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* ---- Base & Fundo Global — garante cor imediata antes do Tailwind ---- */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #F4F7F9;
        color: #142531;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      html[data-theme="dark"], html[data-theme="dark"] body {
        background-color: #0C1923;
        color: #E6EFF5;
      }

      html[data-theme="oled"], html[data-theme="oled"] body {
        background-color: #000000;
        color: #FFFFFF;
      }

      /* ---- Splash Screen Inline ---- */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        background-color: #F4F7F9;
        transition: opacity 0.2s ease-out;
        z-index: 9999;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      html[data-theme="dark"] #app-splash {
        background-color: #0C1923;
      }

      html[data-theme="oled"] #app-splash {
        background-color: #000000;
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) #app-splash {
          background-color: #0C1923;
        }
      }

      /* Wrapper e Halo do Ícone */
      #app-splash-icon-wrap {
        position: relative;
        width: 104px;
        height: 104px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #app-splash-glow {
        position: absolute;
        inset: -24px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(42, 157, 143, 0.22) 0%, transparent 70%);
        animation: splash-glow 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      html[data-theme="dark"] #app-splash-glow,
      html[data-theme="oled"] #app-splash-glow {
        background: radial-gradient(circle, rgba(45, 212, 191, 0.26) 0%, transparent 70%);
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) #app-splash-glow {
          background: radial-gradient(circle, rgba(45, 212, 191, 0.26) 0%, transparent 70%);
        }
      }

      #app-splash-icon {
        width: 104px;
        height: 104px;
        display: block;
        position: relative;
        z-index: 1;
        animation: splash-pulse 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        user-select: none;
        -webkit-user-drag: none;
      }

      /* Barra de progresso sutil */
      #app-splash-progress {
        width: 130px;
        height: 3px;
        border-radius: 9999px;
        background-color: rgba(42, 157, 143, 0.15);
        overflow: hidden;
        position: relative;
      }

      html[data-theme="dark"] #app-splash-progress,
      html[data-theme="oled"] #app-splash-progress {
        background-color: rgba(45, 212, 191, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) #app-splash-progress {
          background-color: rgba(45, 212, 191, 0.15);
        }
      }

      #app-splash-progress-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 45%;
        border-radius: 9999px;
        background: linear-gradient(90deg, transparent, #2A9D8F, transparent);
        animation: splash-progress 1.5s ease-in-out infinite;
      }

      html[data-theme="dark"] #app-splash-progress-bar,
      html[data-theme="oled"] #app-splash-progress-bar {
        background: linear-gradient(90deg, transparent, #2DD4BF, transparent);
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) #app-splash-progress-bar {
          background: linear-gradient(90deg, transparent, #2DD4BF, transparent);
        }
      }

      /* Keyframes */
      @keyframes splash-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.90; transform: scale(0.96); }
      }

      @keyframes splash-glow {
        0%, 100% { transform: scale(1); opacity: 1; }
        50%       { transform: scale(1.18); opacity: 0.55; }
      }

      @keyframes splash-progress {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(280%); }
      }

      /* Redução de movimento */
      @media (prefers-reduced-motion: reduce) {
        #app-splash-icon,
        #app-splash-glow,
        #app-splash-progress-bar {
          animation: none;
        }
      }

      html[data-motion="reduced"] #app-splash-icon,
      html[data-motion="reduced"] #app-splash-glow,
      html[data-motion="reduced"] #app-splash-progress-bar {
        animation: none;
      }

      html[data-motion="eco"] #app-splash-progress-bar {
        animation: none;
      }

      /* Ocultar splash quando React montar */
      #root:not(:empty) #app-splash {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Splash screen inline (sem texto, tema sincronizado, ícone transparente) -->
      <div id="app-splash" aria-hidden="true" role="presentation">
        <div id="app-splash-icon-wrap">
          <div id="app-splash-glow"></div>
          <img
            id="app-splash-icon"
            src="/brand/logo.png"
            alt=""
            width="104"
            height="104"
            decoding="async"
          />
        </div>
        <div id="app-splash-progress">
          <div id="app-splash-progress-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
