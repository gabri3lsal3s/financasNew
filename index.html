    <title>Axir</title>
    <script>
      (function() {
        try {
          function getStoredValue(keyName) {
            var direct = localStorage.getItem('financas_active_' + keyName);
            if (direct) return direct;
            var guest = localStorage.getItem('financas_guest_' + keyName);
            if (guest) return guest;
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && k.indexOf('financas_') === 0 && k.slice(-keyName.length - 1) === '_' + keyName) {
                return localStorage.getItem(k);
              }
            }
            return null;
          }

          var themePref = getStoredValue('theme');
          var darkVariant = getStoredValue('dark_theme_variant') || 'dark';
          var resolvedTheme = 'light';

          if (!themePref || themePref === 'system') {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            resolvedTheme = prefersDark ? (darkVariant === 'oled' ? 'oled' : 'dark') : 'light';
          } else if (themePref === 'schedule') {
            var scheduleRaw = getStoredValue('theme_schedule');
            var dayStart = '06:00';
            var nightStart = '18:00';
            var dayTheme = 'light';
            var nightTheme = darkVariant === 'oled' ? 'oled' : 'dark';
            if (scheduleRaw) {
              try {
                var parsed = JSON.parse(scheduleRaw);
                if (parsed.dayStart) dayStart = parsed.dayStart;
                if (parsed.nightStart) nightStart = parsed.nightStart;
                if (parsed.dayTheme) dayTheme = parsed.dayTheme;
                if (parsed.nightTheme) nightTheme = parsed.nightTheme;
              } catch (e) {}
            }
            var now = new Date();
            var nowMins = now.getHours() * 60 + now.getMinutes();
            var dParts = dayStart.split(':');
            var dMins = parseInt(dParts[0], 10) * 60 + parseInt(dParts[1], 10);
            var nParts = nightStart.split(':');
            var nMins = parseInt(nParts[0], 10) * 60 + parseInt(nParts[1], 10);
            var isDay = false;
            if (dMins < nMins) {
              isDay = nowMins >= dMins && nowMins < nMins;
            } else {
              isDay = nowMins >= dMins || nowMins < nMins;
            }
            resolvedTheme = isDay ? dayTheme : nightTheme;
          } else if (themePref === 'dark' || themePref === 'oled') {
            resolvedTheme = themePref;
          } else {
            resolvedTheme = 'light';
          }

          document.documentElement.setAttribute('data-theme', resolvedTheme);
          document.documentElement.style.colorScheme = resolvedTheme === 'light' ? 'light' : 'dark';

          var themeColor = resolvedTheme === 'oled' ? '#000000' : (resolvedTheme === 'dark' ? '#0C1923' : '#F4F7F9');
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas.forEach(function(m) {
            m.setAttribute('content', themeColor);
          });

          var accent = getStoredValue('accent_theme');
          if (accent && accent !== 'teal') {
            document.documentElement.setAttribute('data-accent', accent);
          }
          var surface = getStoredValue('surface_style');
          if (surface && surface !== 'glass') {
            document.documentElement.setAttribute('data-surface-style', surface);
          }
          var motion = getStoredValue('motion_level');
          if (motion && motion !== 'fluid') {
            document.documentElement.setAttribute('data-motion', motion);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* ---- Base & Fundo Global — garante cor imediata antes do Tailwind ---- */
      html {
        margin: 0;
        padding: 0;
        background-color: #F4F7F9;
        color: #142531;
        color-scheme: light;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: clip;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: inherit;
        color: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      a, button, input, select, textarea, [role="button"], [role="tab"] {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      html[data-theme="dark"], html[data-theme="dark"] body {
        background-color: #0C1923;
        color: #E6EFF5;
        color-scheme: dark;
      }

      html[data-theme="oled"], html[data-theme="oled"] body {
        background-color: #000000;
        color: #FFFFFF;
        color-scheme: dark;
      }

      /* ---- Splash Screen Inline — Fundo acompanha o tema ativo com transição de fade suave ---- */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #F4F7F9;
        color: #142531;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.35s ease;
        z-index: 9999;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        pointer-events: auto;
      }

      html[data-theme="dark"] #app-splash {
        background-color: #0C1923;
        color: #E6EFF5;
      }

      html[data-theme="oled"] #app-splash {
        background-color: #000000;
        color: #FFFFFF;
      }

      .app-splash-icon {
        width: clamp(84px, 22vw, 116px);
        height: auto;
        aspect-ratio: 1 / 1;
        display: none;
        animation: splash-pulse 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: transform, opacity;
        user-select: none;
        -webkit-user-drag: none;
        filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.08));
      }

      /* Responsividade visual ao tema ativo (Claro vs Escuro/OLED) */
      html[data-theme="light"] .app-splash-light {
        display: block;
      }
      html[data-theme="light"] .app-splash-dark {
        display: none;
      }

      html[data-theme="dark"] .app-splash-light,
      html[data-theme="oled"] .app-splash-light {
        display: none;
      }
      html[data-theme="dark"] .app-splash-dark,
      html[data-theme="oled"] .app-splash-dark {
        display: block;
      }

      /* Fallback com prefers-color-scheme antes de data-theme ser injetado */
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) .app-splash-light {
          display: none;
        }
        html:not([data-theme="light"]) .app-splash-dark {
          display: block;
        }
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme="dark"]):not([data-theme="oled"]) .app-splash-light {
          display: block;
        }
        html:not([data-theme="dark"]):not([data-theme="oled"]) .app-splash-dark {
          display: none;
        }
      }

      /* Keyframes */
      @keyframes splash-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.94; transform: scale(0.97); }
      }

      /* Redução de movimento */
      @media (prefers-reduced-motion: reduce) {
        .app-splash-icon {
          animation: none;
        }
      }

      html[data-motion="reduced"] .app-splash-icon {
        animation: none;
      }

      /* Ocultar splash com fade suave quando o app for montado ou classe for adicionada */
      #app-splash.splash-fade-out,
      body.app-mounted #app-splash,
      body:has(#root:not(:empty)) #app-splash {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Splash screen inline inicial com fade suave e logo responsiva ao tema ativo -->

      <img

            var l = document.getElementById('app-splash-icon-light');
            var d = document.getElementById('app-splash-icon-dark');
            if (isPro) {
              if (l) l.src = '/brand/logo-amber-light-192.webp';
              if (d) d.src = '/brand/logo-amber-dark-192.webp';
            } else {
              if (l) l.src = '/brand/logo-teal-light-192.webp';
              if (d) d.src = '/brand/logo-teal-dark-192.webp';
            }
          } catch (e) {}
        })();
      </script>
