<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Gestão financeira pessoal e rebalanceamento de carteira." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F7F9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <link rel="manifest" href="/pwa/manifest.webmanifest" />
    <!-- Favicons com cache-busting (?v=2 — o navegador mantém o favicon antigo agressivamente) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa/icons/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/pwa/icons/apple-touch-icon-180.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Guia Financeiro" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <title>Guia Financeiro</title>
    <script>
      (function() {
        try {
          function getStoredValue(keyName) {
            var direct = localStorage.getItem('financas_active_' + keyName);
            if (direct) return direct;
            var guest = localStorage.getItem('financas_guest_' + keyName);
            if (guest) return guest;
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && k.indexOf('financas_') === 0 && k.slice(-keyName.length - 1) === '_' + keyName) {
                return localStorage.getItem(k);
              }
            }
            return null;
          }

          var theme = getStoredValue('theme');
          if (!theme || theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oled' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark';

          var themeColor = theme === 'oled' ? '#000000' : (theme === 'dark' ? '#0C1923' : '#F4F7F9');
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas.forEach(function(m) {
            m.setAttribute('content', themeColor);
          });

          var accent = getStoredValue('accent_theme');
          if (accent && accent !== 'teal') {
            document.documentElement.setAttribute('data-accent', accent);
          }
          var surface = getStoredValue('surface_style');
          if (surface && surface !== 'glass') {
            document.documentElement.setAttribute('data-surface-style', surface);
          }
          var motion = getStoredValue('motion_level');
          if (motion && motion !== 'fluid') {
            document.documentElement.setAttribute('data-motion', motion);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* ---- Base & Fundo Global — garante cor imediata antes do Tailwind ---- */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #F4F7F9;
        color: #142531;
        color-scheme: light;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      html[data-theme="dark"], html[data-theme="dark"] body {
        background-color: #0C1923;
        color: #E6EFF5;
        color-scheme: dark;
      }

      html[data-theme="oled"], html[data-theme="oled"] body {
        background-color: #000000;
        color: #FFFFFF;
        color-scheme: dark;
      }

      /* ---- Splash Screen Inline — Fundo acompanha o tema ativo com o ícone ---- */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #F4F7F9;
        color: #142531;
        transition: opacity 0.22s ease-out;
        z-index: 9999;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      html[data-theme="dark"] #app-splash {
        background-color: #0C1923;
        color: #E6EFF5;
      }

      html[data-theme="oled"] #app-splash {
        background-color: #000000;
        color: #FFFFFF;
      }

      #app-splash-icon {
        width: 144px;
        height: 144px;
        display: block;
        animation: splash-pulse 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        user-select: none;
        -webkit-user-drag: none;
      }

      /* Keyframes */
      @keyframes splash-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.92; transform: scale(0.97); }
      }

      /* Redução de movimento */
      @media (prefers-reduced-motion: reduce) {
        #app-splash-icon {
          animation: none;
        }
      }

      html[data-motion="reduced"] #app-splash-icon {
        animation: none;
      }

      /* Ocultar splash quando React montar */
      #root:not(:empty) #app-splash {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Splash screen inline (fundo sincronizado ao tema, somente o ícone) -->
      <div id="app-splash" aria-hidden="true" role="presentation">
        <img
          id="app-splash-icon"
          src="/brand/logo.png"
          alt=""
          width="144"
          height="144"
          decoding="async"
        />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
