<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Gestão financeira pessoal e rebalanceamento de carteira." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F7F9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C1923" />
    <link rel="manifest" href="/pwa/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/pwa/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Guia Financeiro" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <title>Guia Financeiro — Gestão Financeira Pessoal</title>
    <script>
      (function() {
        try {
          var accent = localStorage.getItem('financas_accent_theme');
          if (accent && accent !== 'teal') {
            document.documentElement.setAttribute('data-accent', accent);
          }
          var theme = localStorage.getItem('financas:theme');
          if (!theme || theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          var surface = localStorage.getItem('financas_surface_style');
          if (surface && surface !== 'glass') {
            document.documentElement.setAttribute('data-surface-style', surface);
          }
          var motion = localStorage.getItem('financas_motion_level');
          if (motion && motion !== 'fluid') {
            document.documentElement.setAttribute('data-motion', motion);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
