<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Gestão financeira pessoal e rebalanceamento de carteira." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F7F9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C1923" />
    <link rel="manifest" href="/pwa/manifest.webmanifest" />
    <!-- Favicons com cache-busting (?v=2 — o navegador mantém o favicon antigo agressivamente) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa/icons/icon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/pwa/icons/apple-touch-icon-180.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Guia Financeiro" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <title>Guia Financeiro</title>
    <script>
      (function() {
        try {
          var accent = localStorage.getItem('financas_accent_theme');
          if (accent && accent !== 'teal') {
            document.documentElement.setAttribute('data-accent', accent);
          }
          var theme = localStorage.getItem('financas:theme');
          if (!theme || theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          var surface = localStorage.getItem('financas_surface_style');
          if (surface && surface !== 'glass') {
            document.documentElement.setAttribute('data-surface-style', surface);
          }
          var motion = localStorage.getItem('financas_motion_level');
          if (motion && motion !== 'fluid') {
            document.documentElement.setAttribute('data-motion', motion);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* ---- Splash Screen — valores hard-coded para funcionar antes do Tailwind/tokens ---- */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* Fundo light padrão */
        background-color: #F4F7F9;
        transition: opacity 0.25s ease-out;
        z-index: 9999;
        /* Safe areas para notch/barra do sistema */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* Tema escuro */
      html[data-theme="dark"] #app-splash {
        background-color: #0C1923;
      }

      /* Tema OLED */
      html[data-theme="oled"] #app-splash {
        background-color: #000000;
      }

      /* Fallback sem JS: segue preferência do sistema */
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) #app-splash {
          background-color: #0C1923;
        }
      }

      /* ---- Wrapper do ícone ---- */
      #app-splash-icon-wrap {
        position: relative;
        width: 120px;
        height: 120px;
        margin-bottom: 48px;
      }

      /* Halo de brilho pulsante atrás do ícone */
      #app-splash-icon-wrap::before {
        content: '';
        position: absolute;
        inset: -16px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(42, 157, 143, 0.18) 0%, transparent 70%);
        animation: splash-glow 2s ease-in-out infinite;
      }

      html[data-theme="dark"] #app-splash-icon-wrap::before,
      html[data-theme="oled"] #app-splash-icon-wrap::before {
        background: radial-gradient(circle, rgba(45, 212, 191, 0.22) 0%, transparent 70%);
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) #app-splash-icon-wrap::before {
          background: radial-gradient(circle, rgba(45, 212, 191, 0.22) 0%, transparent 70%);
        }
      }

      /* ---- Ícone principal ---- */
      #app-splash-icon {
        width: 120px;
        height: 120px;
        border-radius: 26px;
        display: block;
        position: relative;
        z-index: 1;
        animation: splash-pulse 2s ease-in-out infinite;
      }

      /* ---- Barra de progresso na base da tela ---- */
      #app-splash-bar-track {
        position: fixed;
        bottom: calc(env(safe-area-inset-bottom) + 0px);
        left: 0;
        right: 0;
        height: 3px;
        background-color: rgba(42, 157, 143, 0.15);
        overflow: hidden;
      }

      html[data-theme="dark"] #app-splash-bar-track,
      html[data-theme="oled"] #app-splash-bar-track {
        background-color: rgba(45, 212, 191, 0.12);
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) #app-splash-bar-track {
          background-color: rgba(45, 212, 191, 0.12);
        }
      }

      #app-splash-bar-fill {
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, transparent, #2A9D8F, transparent);
        animation: splash-bar 1.6s ease-in-out infinite;
      }

      html[data-theme="dark"] #app-splash-bar-fill,
      html[data-theme="oled"] #app-splash-bar-fill {
        background: linear-gradient(90deg, transparent, #2DD4BF, transparent);
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) #app-splash-bar-fill {
          background: linear-gradient(90deg, transparent, #2DD4BF, transparent);
        }
      }

      /* ---- Animações ---- */
      @keyframes splash-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.88; transform: scale(0.97); }
      }

      @keyframes splash-glow {
        0%, 100% { transform: scale(1); opacity: 1; }
        50%       { transform: scale(1.15); opacity: 0.6; }
      }

      @keyframes splash-bar {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(300%); }
      }

      /* Desligar animações em modo reduzido */
      @media (prefers-reduced-motion: reduce) {
        #app-splash-icon,
        #app-splash-icon-wrap::before,
        #app-splash-bar-fill {
          animation: none;
        }
      }

      html[data-motion="reduced"] #app-splash-icon,
      html[data-motion="reduced"] #app-splash-icon-wrap::before,
      html[data-motion="reduced"] #app-splash-bar-fill {
        animation: none;
      }

      /* Desligar shimmer em modo eco (mantém fade) */
      html[data-motion="eco"] #app-splash-bar-fill {
        animation: none;
      }

      /* Ocultar o splash assim que o React montar conteúdo real no #root */
      #root:not(:empty) #app-splash {
        opacity: 0;
        pointer-events: none;
      }

      /* ====================================================================
         Window Controls Overlay — barra de título customizada do PWA
         Ativa apenas quando display-mode: window-controls-overlay está ativo
         (Chrome/Edge com PWA instalado + display_override no manifest).
         Fora desse contexto a div fica com display:none (não afeta o app).
         ==================================================================== */
      #app-titlebar {
        display: none;
      }

      @media (display-mode: window-controls-overlay) {
        #app-titlebar {
          display: block;
          position: fixed;
          /* Posição e tamanho definidos pelo browser via env() */
          left: env(titlebar-area-x, 0);
          top: env(titlebar-area-y, 0);
          width: env(titlebar-area-width, 100%);
          height: env(titlebar-area-height, 33px);
          z-index: 99999;

          /* Área arrastável — move a janela ao clicar e arrastar */
          -webkit-app-region: drag;
          app-region: drag;

          /* Cor de fundo: light (padrão) */
          background-color: #F4F7F9;

          /* Borda inferior sutil (divisor com o conteúdo do app) */
          border-bottom: 1px solid #D7E1E6;
        }

        html[data-theme="dark"] #app-titlebar {
          background-color: #0C1923;
          border-bottom-color: #23384A;
        }

        html[data-theme="oled"] #app-titlebar {
          background-color: #000000;
          border-bottom-color: #2E2E2E;
        }

        @media (prefers-color-scheme: dark) {
          html:not([data-theme]) #app-titlebar {
            background-color: #0C1923;
            border-bottom-color: #23384A;
          }
        }

        /* Compensa o espaço ocupado pela barra de título no layout da página */
        #root {
          padding-top: env(titlebar-area-height, 33px);
        }
      }
    </style>
  </head>
  <body>
    <!-- Barra de título customizada do PWA (Window Controls Overlay).
         Visível apenas quando o app roda como PWA instalado com WCO ativo.
         Sem ícone nem texto — área limpa e arrastável no tom do tema. -->
    <div id="app-titlebar" aria-hidden="true"></div>

    <div id="root">
      <!-- Splash screen — some automaticamente quando o React monta (#root:not(:empty)) -->
      <div id="app-splash" aria-hidden="true" role="presentation">
        <div id="app-splash-icon-wrap">
          <img
            id="app-splash-icon"
            src="/pwa/icons/icon-512.png"
            alt=""
            width="120"
            height="120"
            decoding="async"
          />
        </div>
        <div id="app-splash-bar-track">
          <div id="app-splash-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
