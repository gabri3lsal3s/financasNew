    <script>
      (function() {
        try {
          function getStoredValue(keyName) {
            var direct = localStorage.getItem('financas_active_' + keyName);
            if (direct) return direct;
            var guest = localStorage.getItem('financas_guest_' + keyName);
            if (guest) return guest;
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && k.indexOf('financas_') === 0 && k.slice(-keyName.length - 1) === '_' + keyName) {
                return localStorage.getItem(k);
              }
            }
            return null;
          }

          var themePref = getStoredValue('theme');
          var darkVariant = getStoredValue('dark_theme_variant') || 'dark';
          var resolvedTheme = 'light';

          if (!themePref || themePref === 'system') {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            resolvedTheme = prefersDark ? (darkVariant === 'oled' ? 'oled' : 'dark') : 'light';
          } else if (themePref === 'schedule') {
            var scheduleRaw = getStoredValue('theme_schedule');
            var dayStart = '06:00';
            var nightStart = '18:00';
            var dayTheme = 'light';
            var nightTheme = darkVariant === 'oled' ? 'oled' : 'dark';
            if (scheduleRaw) {
              try {
                var parsed = JSON.parse(scheduleRaw);
                if (parsed.dayStart) dayStart = parsed.dayStart;
                if (parsed.nightStart) nightStart = parsed.nightStart;
                if (parsed.dayTheme) dayTheme = parsed.dayTheme;
                if (parsed.nightTheme) nightTheme = parsed.nightTheme;
              } catch (e) {}
            }
            var now = new Date();
            var nowMins = now.getHours() * 60 + now.getMinutes();
            var dParts = dayStart.split(':');
            var dMins = parseInt(dParts[0], 10) * 60 + parseInt(dParts[1], 10);
            var nParts = nightStart.split(':');
            var nMins = parseInt(nParts[0], 10) * 60 + parseInt(nParts[1], 10);
            var isDay = false;
            if (dMins < nMins) {
              isDay = nowMins >= dMins && nowMins < nMins;
            } else {
              isDay = nowMins >= dMins || nowMins < nMins;
            }
            resolvedTheme = isDay ? dayTheme : nightTheme;
          } else if (themePref === 'dark' || themePref === 'oled') {
            resolvedTheme = themePref;
          } else {
            resolvedTheme = 'light';
          }

          document.documentElement.setAttribute('data-theme', resolvedTheme);
          document.documentElement.style.colorScheme = resolvedTheme === 'light' ? 'light' : 'dark';

          var themeColor = resolvedTheme === 'oled' ? '#000000' : (resolvedTheme === 'dark' ? '#0C1923' : '#F4F7F9');
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas.forEach(function(m) {
            m.setAttribute('content', themeColor);
          });

          var path = window.location.pathname || '';
          var isPublicOrAuthPath =
            path === '/' ||
            path.indexOf('/entrar') === 0 ||
            path.indexOf('/cadastro') === 0 ||
            path.indexOf('/cadastrar') === 0 ||
            path.indexOf('/criar-conta') === 0 ||
            path.indexOf('/recuperar-senha') === 0 ||
            path.indexOf('/redefinir-senha') === 0 ||
            path.indexOf('/atualizar-senha') === 0 ||
            path.indexOf('/apresentacao') === 0 ||
            path.indexOf('/landing') === 0 ||
            path.indexOf('/precos') === 0 ||
            path.indexOf('/planos') === 0 ||
            path.indexOf('/vendas') === 0 ||
            path.indexOf('/termos') === 0 ||
            path.indexOf('/privacidade') === 0 ||
            path.indexOf('/r/') === 0 ||
            path.indexOf('/orcamento-familiar/') === 0 ||
            path.indexOf('/meta/') === 0 ||
            path.indexOf('/convite-familiar/') === 0 ||
            path.indexOf('/viagem/') === 0 ||
            path.indexOf('/ferramentas') === 0 ||
            path.indexOf('/admin/login') === 0;

          var hasActiveSession = (function() {
            try {
              for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (k && k.indexOf('sb-') === 0 && k.indexOf('-auth-token') !== -1) {
                  var item = localStorage.getItem(k);
                  if (item && item.indexOf('access_token') !== -1) return true;
                }
              }
            } catch (e) {}
            return false;
          })();

          // Só aplica cor de destaque personalizada (accent) quando o usuário estiver em rota autenticada
          // com sessão confirmada. Telas públicas e de auth usam sempre o Teal Vital oficial (sem data-accent).
          if (!isPublicOrAuthPath && hasActiveSession) {
            var activeUid = localStorage.getItem('financas_active_user_id');
            var accent = activeUid
              ? localStorage.getItem('financas_' + activeUid + '_accent_theme')
              : getStoredValue('accent_theme');
            if (accent && accent !== 'teal') {
              document.documentElement.setAttribute('data-accent', accent);
            }
          } else {
            document.documentElement.removeAttribute('data-accent');
          }
          var surface = getStoredValue('surface_style');
          if (surface && surface !== 'glass') {
            document.documentElement.setAttribute('data-surface-style', surface);
          }
          var motion = getStoredValue('motion_level');
          if (motion && motion !== 'fluid') {
            document.documentElement.setAttribute('data-motion', motion);
          }
        } catch (e) {}
      })();
    </script>

      /* ---- Base & Fundo Global — garante cor imediata antes do Tailwind ---- */
      html {
        margin: 0;
        padding: 0;
        background-color: #F4F7F9;
        color: #142531;
        color-scheme: light;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: inherit;
        color: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      a, button, input, select, textarea, [role="button"], [role="tab"] {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      html[data-theme="dark"], html[data-theme="dark"] body {
        background-color: #0C1923;
        color: #E6EFF5;
        color-scheme: dark;
      }

      html[data-theme="oled"], html[data-theme="oled"] body {
        background-color: #000000;
        color: #EDEDED;
        color-scheme: dark;
      }

      /* ---- Splash Screen Inline — Fundo acompanha o tema ativo com transição de fade suave ---- */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #F4F7F9;
        color: #142531;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.35s ease;
        z-index: 9999;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        pointer-events: auto;
      }

      html[data-theme="dark"] #app-splash {
        background-color: #0C1923;
        color: #E6EFF5;
      }

      html[data-theme="oled"] #app-splash {
        background-color: #000000;
        color: #EDEDED;
      }

      .app-splash-icon {
        width: 64px;
        height: 64px;
        aspect-ratio: 1 / 1;
        display: none;
        object-fit: contain;
        will-change: opacity;
        user-select: none;
        -webkit-user-drag: none;
        font-size: 0;
        color: transparent;
        line-height: 0;
      }

      /* Responsividade visual ao tema ativo (Claro vs Escuro/OLED) */
      html[data-theme="light"] .app-splash-light {
        display: block;
      }
      html[data-theme="light"] .app-splash-dark {
        display: none;
      }

      html[data-theme="dark"] .app-splash-light,
      html[data-theme="oled"] .app-splash-light {
        display: none;
      }
      html[data-theme="dark"] .app-splash-dark,
      html[data-theme="oled"] .app-splash-dark {
        display: block;
      }

      /* Fallback com prefers-color-scheme antes de data-theme ser injetado */
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) .app-splash-light {
          display: none;
        }
        html:not([data-theme="light"]) .app-splash-dark {
          display: block;
        }
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme="dark"]):not([data-theme="oled"]) .app-splash-light {
          display: block;
        }
        html:not([data-theme="dark"]):not([data-theme="oled"]) .app-splash-dark {
          display: none;
        }
      }

      /* Ocultar splash com fade suave quando o app for montado ou classe for adicionada */
      #app-splash.splash-fade-out,
      body.app-mounted #app-splash {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
