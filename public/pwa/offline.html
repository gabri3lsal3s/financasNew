<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão — Finanças</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #fafaf9;
        color: #1c1917;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #f8fafc;
        }
      }
      .card {
        text-align: center;
        max-width: 320px;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        opacity: 0.8;
        margin-bottom: 20px;
      }
      button {
        border: 0;
        border-radius: 12px;
        background: #047857;
        color: #fff;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #065f46;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Sem conexão</h1>
      <p>O app é Online First: os dados ficam na nuvem. Reconecte-se e tente novamente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
