<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-fav-primary-grad" x1="100" y1="420" x2="260" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <linearGradient id="brand-fav-primary-depth-grad" x1="160" y1="420" x2="295" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>

    <linearGradient id="brand-fav-gold-grad" x1="280" y1="92" x2="430" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="brand-fav-gold-depth-grad" x1="260" y1="92" x2="350" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="brand-fav-orbit-grad" x1="40" y1="360" x2="470" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="15%" stop-color="#B45309" />
      <stop offset="35%" stop-color="#D97706" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="brand-fav-specular" x1="60" y1="360" x2="440" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="55%" stop-color="#FFFBEB" stop-opacity="0.95" />
      <stop offset="80%" stop-color="#FEF3C7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 1. Arco Traseiro da Órbita -->
  <path
    d="M 40 347 C 45 295 100 230 190 185 C 275 142 360 115 422 108 C 450 105 470 120 472 148 C 460 130 430 125 395 135 C 335 152 255 190 185 235 C 115 280 65 325 40 347 Z"
    fill="url(#brand-fav-orbit-grad)"
    opacity="0.92"
  />

  <!-- 2. Perna Esquerda — Face de Profundidade 3D -->
  <polygon
    points="231,92 281,92 161,421 118,421 216,215"
    fill="url(#brand-fav-primary-depth-grad)"
  />

  <!-- 3. Perna Esquerda — Face Frontal Cromática -->
  <polygon
    points="231,92 281,92 133,421 82,421"
    fill="url(#brand-fav-primary-grad)"
  />

  <!-- 4. Perna Direita — Face Frontal Dourada -->
  <polygon
    points="281,92 295,92 431,421 380,421"
    fill="url(#brand-fav-gold-grad)"
  />

  <!-- 5. Perna Direita — Bevel 3D -->
  <polygon
    points="281,92 349,421 380,421"
    fill="url(#brand-fav-gold-depth-grad)"
  />

  <!-- 6. Órbita Frontal Dinâmica -->
  <path
    d="M 40 347 C 48 375 105 402 195 398 C 290 394 380 345 440 255 C 468 212 478 172 472 148 C 470 170 452 210 422 252 C 365 335 280 376 195 380 C 118 384 68 362 40 347 Z"
    fill="url(#brand-fav-orbit-grad)"
  />

  <!-- 7. Filete Luminoso Interno da Órbita -->
  <path
    d="M 58 354 C 110 380 190 383 275 365 C 355 348 420 300 452 238 C 462 218 468 190 468 172 C 462 192 450 220 422 255 C 380 308 322 348 250 366 C 180 380 110 378 68 360 C 62 357 58 354 58 354 Z"
